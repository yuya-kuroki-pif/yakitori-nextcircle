name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 18 * * *"   # 毎日 03:30 JST（評価更新の反映用）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect static files
        run: |
          rm -rf _site && mkdir -p _site
          rsync -a \
            --exclude .git --exclude .github --exclude scripts --exclude _site \
            --exclude README.md --exclude site.config.json --exclude CNAME \
            --exclude .nojekyll --exclude .gitignore \
            --exclude wrangler.json --exclude wrangler.deploy.json --exclude .wrangler \
            ./ _site/
          echo "files: $(find _site -type f | wc -l)"
      - name: Prepare Wrangler config
        run: python3 scripts/cloudflare_config.py
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy --config wrangler.deploy.json
